name: Monthly market reports

on:
  schedule:
    - cron: "0 7 1 * *"   # 07:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python report.py --all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Publish to Wix
        run: python wix_publish.py
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
      # PDFs are kept as a downloadable bundle on the run page (not committed to the
      # public repo, so the lead-magnet downloads stay behind your Wix form).
      - uses: actions/upload-artifact@v4
        with:
          name: market-reports
          path: reports/
          retention-days: 90
